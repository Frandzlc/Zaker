name: Zaker
options:
  bundleIdPrefix: com.fahad
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Zaker:
    type: application
    platform: iOS
    sources:
      - path: Zaker
    info:
      path: Zaker/Info.plist
      properties:
        CFBundleDisplayName: ذاكر
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSMicrophoneUsageDescription: "ذاكر يحتاج المايك عشان تسجّل الشرح في دفترك. Zaker uses the microphone to record audio notes."
        NSCameraUsageDescription: "ذاكر يحتاج الكاميرا عشان تضيف صور لدفترك. Zaker uses the camera to add photos to your notes."
        NSPhotoLibraryUsageDescription: "ذاكر يضيف صورك لدفترك. Zaker adds your photos to your notes."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.content, public.data, com.adobe.pdf, public.image, public.text]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fahad.zaker
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}
